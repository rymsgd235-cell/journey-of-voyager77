<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Journey of Voyager</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body {
            font-family: arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0b10;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .emscripten_border {
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 85vh;
        }

        canvas.emscripten {
            border: 0 none;
            background-color: #000;
            width: 1280px;
            height: 720px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Clean, non-intrusive fullscreen resizing logic */
        #canvas:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important;
        }

        .btn-container {
            text-align: center;
            margin-top: 15px;
            height: 5vh;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #1f232a;
            color: #fff;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <div class="emscripten_border">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div class="btn-container">
        <button onclick="Module.requestFullscreen(false, false)">Go Fullscreen</button>
    </div>

    <script>
        var Module = {
            noInitialRun: false,
            preRun: [function() {
                // Setting up IDBFS virtual environment for persistent score tracking
                try {
                    FS.mkdir('/save');
                    FS.mount(IDBFS, {}, '/save');
                    
                    // Forcefully pull existing browser scores before the engine reads files
                    Module.addRunDependency('syncfs');
                    FS.syncfs(true, function (err) {
                        if (err) console.error("IndexedDB initialization sync failed:", err);
                        Module.removeRunDependency('syncfs');
                    });
                } catch(e) {
                    console.log("FS setup notice:", e);
                }
            }],
            postRun: [],
            print: function(text) { console.log(text); },
            canvas: (() => {
                var e = document.getElementById("canvas");
                
                // Absolute structural bypass to stop Emscripten from taking cursor control
                e.requestPointerLock = function() { };
                document.exitPointerLock = function() { };
                
                e.addEventListener("mousedown", function() {
                    e.focus();
                });
                return e;
            })()
        };

        // Global safeguard to catch and release pointer capture attempts instantly
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.getElementById('canvas')) {
                document.exitPointerLock();
            }
        }, false);
    </script>
    <script src="coi-serviceworker.js"></script>
</body>
</html>
